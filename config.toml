baseURL = "https://ejmastnak.com/"
locale = 'en-us'
title = 'ejmastnak'
disableKinds = ['taxonomy', 'term', 'section']

[security]
  allowContent = ['^text/html$', '^text/markdown$']

[markup]
  [markup.highlight]
      noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

enableGitInfo = true
[frontmatter]
date = ["date", "publishDate", "lastmod"]
lastmod = ["lastmod", ":git", "date", "publishDate"]
